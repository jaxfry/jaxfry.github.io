<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Resume" }}</title>
    <link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/resume.css' | relative_url }}">
</head>
<body>
    <nav class="pf-topnav">
        <a href="{{ '/resume' | relative_url }}" class="pf-topnav-brand">Jaxon</a>
        <div class="pf-topnav-links">
            <a href="{{ '/' | relative_url }}" id="jaxfry-home-link">JaxFry <i class="fa-solid fa-arrow-right fa-xs"></i></a>
        </div>
    </nav>

    {{ content }}

    <footer class="pf-footer">
        <p>&copy; {{ 'now' | date: '%Y' }} Jaxon &middot; <a href="/">JaxFry</a></p>
    </footer>
    <script>
        (function () {
            var link = document.getElementById('jaxfry-home-link');
            if (!link) return;

            var isJaxfryDomain = function (host) {
                return host === 'jaxfry.xyz' || host === 'www.jaxfry.xyz';
            };

            var currentHost = window.location.hostname;
            var fromReferrer = false;

            if (document.referrer) {
                try {
                    var refHost = new URL(document.referrer).hostname;
                    fromReferrer = isJaxfryDomain(refHost);
                } catch (e) {
                    fromReferrer = false;
                }
            }

            if (isJaxfryDomain(currentHost) || fromReferrer) {
                link.style.display = 'none';
            }
        })();
    </script>
</body>
</html>
