<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Resume" }}</title>
    <link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/resume.css' | relative_url }}">
</head>
<body>
    <nav class="pf-topnav">
        <a href="{{ '/resume' | relative_url }}" class="pf-topnav-brand">Jaxon</a>
        <div class="pf-topnav-links">
            <a href="#" id="email-link-nav" class="pf-nav-email"><i class="fa-solid fa-envelope"></i> Email Me</a>
            <a href="{{ '/' | relative_url }}" id="jaxfry-home-link">JaxFry <i class="fa-solid fa-arrow-right fa-xs"></i></a>
        </div>
    </nav>

    {{ content }}

    <footer class="pf-footer">
        <p><a href="#" id="email-link-footer"><i class="fa-solid fa-envelope"></i> Email Me</a></p>
        <p>&copy; {{ 'now' | date: '%Y' }} Jaxon &middot; <a href="/">JaxFry</a></p>
    </footer>
    <script>
        (function () {
            var homeLink = document.getElementById('jaxfry-home-link');

            var isJaxfryDomain = function (host) {
                return host === 'jaxfry.xyz' || host === 'www.jaxfry.xyz';
            };

            var currentHost = window.location.hostname;
            var fromReferrer = false;

            if (document.referrer) {
                try {
                    var refHost = new URL(document.referrer).hostname;
                    fromReferrer = isJaxfryDomain(refHost);
                } catch (e) {
                    fromReferrer = false;
                }
            }

            var fromJaxfry = isJaxfryDomain(currentHost) || fromReferrer;

            if (homeLink && fromJaxfry) {
                homeLink.style.display = 'none';
            }

            var emailLink = document.getElementById('email-link');
            var emailLinkNav = document.getElementById('email-link-nav');
            var emailLinkFooter = document.getElementById('email-link-footer');

            if (emailLink && fromJaxfry) {
                emailLink.classList.add('pf-email-priority');
            }

            if (emailLink || emailLinkNav || emailLinkFooter) {
                var p1 = [106, 97, 120, 102, 114, 121];
                var p2 = [105, 99, 108, 111, 117, 100];
                var decode = function (codes) {
                    return String.fromCharCode.apply(null, codes);
                };
                var address = decode(p1) + '@' + decode(p2) + '.com';
                [emailLink, emailLinkNav, emailLinkFooter].forEach(function (el) {
                    if (el) {
                        el.setAttribute('href', 'mailto:' + address);
                        el.setAttribute('title', address);
                    }
                });
            }
        })();
    </script>
</body>
</html>
